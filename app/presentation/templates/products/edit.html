{% extends "base.html" %}

{% block content %}
<section class="panel">
    <h2>Editar producto</h2>

    <form class="form-grid" method="post" action="{{ url_for('web.update_product', product_id=product.id) }}">
        <label>
            Nombre
            <input name="name" maxlength="120" required value="{{ product.name }}">
        </label>
        <label>
            Precio
            <input name="price" type="number" step="0.01" min="0.01" required value="{{ product.price }}">
        </label>
        <label>
            Stock
            <input name="stock" type="number" min="0" step="1" required value="{{ product.stock }}">
        </label>
        <div class="actions">
            <button type="submit">Actualizar</button>
            <a class="button secondary" href="{{ url_for('web.index') }}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
